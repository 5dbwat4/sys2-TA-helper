<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}助教管理 · 计算机系统II{% endblock %}</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;min-height:100vh;display:flex}
  .sidebar{width:210px;background:#0f172a;color:#fff;min-height:100vh;padding:20px 0;flex-shrink:0;position:relative}
  .sidebar .logo{padding:0 20px 20px;font-size:16px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:8px}
  .sidebar a{display:block;padding:12px 20px;color:rgba(255,255,255,.65);text-decoration:none;font-size:14px;transition:.2s}
  .sidebar a:hover{color:#fff;background:rgba(255,255,255,.08)}
  .sidebar a.active{color:#fff;background:#2563eb}
  .sidebar .user-badge{padding:16px 20px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:rgba(255,255,255,.5);position:absolute;bottom:0;width:210px}
  .main{flex:1;min-width:0}
  .topbar{background:#fff;padding:12px 24px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;justify-content:space-between;align-items:center}
  .topbar h1{font-size:18px;color:#1a1a1a}
  .topbar .user-info{font-size:13px;color:#999}
  .topbar .user-info strong{color:#333}
  .content{padding:24px;max-width:1400px}
  .btn{padding:8px 20px;border:0;border-radius:6px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block;transition:.2s}
  .btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#3b82f6}
  .btn-default{background:#fff;color:#333;border:1px solid #d9d9d9}.btn-default:hover{border-color:#2563eb;color:#2563eb}
  .btn-sm{padding:4px 12px;font-size:12px}
  .table-wrap{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th,td{padding:10px 14px;text-align:center;font-size:13px;border-bottom:1px solid #f0f0f0;white-space:nowrap}
  th{background:#fafafa;color:#333;font-weight:500}
  tr:hover td{background:#f5f9ff}
  input[type=text],textarea{padding:8px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;outline:none;font-family:inherit}
  input[type=text]:focus,textarea:focus{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.1)}
  .bonus-label{color:#16a34a;font-weight:500}
  .score-na{color:#ccc}
  .error-box{background:#fef2f2;border:1px solid #fecaca;color:#ef4444;padding:10px 16px;border-radius:6px;font-size:13px;margin-bottom:16px}
  .success-box{background:#f0fdf4;border:1px solid #bbf7d0;color:#16a34a;padding:10px 16px;border-radius:6px;font-size:13px;margin-bottom:16px}
  select{padding:8px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;background:#fff}
</style>
{% block extra_css %}{% endblock %}
</head>
<body>
  <div class="sidebar">
    <div class="logo">助教管理 · 计算机系统II</div>
    <a href="/grade/staff" class="{% if request.path == '/grade/staff' %}active{% endif %}">📋 学生列表</a>
    <a href="/grade/batch" class="{% if request.path.startswith('/grade/batch') %}active{% endif %}">📝 批量录入</a>
    <a href="/grade/single" class="{% if request.path.startswith('/grade/single') %}active{% endif %}">✏️ 按尾号批改</a>
    <a href="/dashboard" style="margin-top:20px">🏠 返回控制台</a>
    <a href="/logout">🚪 退出登录</a>
    <div class="user-badge">{{ user.name }} ({{ user.id }})</div>
  </div>
  <div class="main">
    <div class="topbar">
      <h1>{% block header %}助教管理{% endblock %}</h1>
      <span class="user-info">当前用户: <strong>{{ user.name }}</strong></span>
    </div>
    <div class="content">{% block content %}{% endblock %}</div>
  </div>
  {% block extra_js %}{% endblock %}
</body>
</html>
