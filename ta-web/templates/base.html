<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}计算机系统II · 用户系统{% endblock %}</title>
<style>
  :root{
    --bg:#0f172a; --card:#ffffff; --ink:#0f172a; --muted:#64748b;
    --line:#e2e8f0; --brand:#2563eb; --brand2:#7c3aed; --err:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#0f172a 0%,#1e293b 55%,#312e81 100%);
    min-height:100vh;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--card);width:100%;max-width:420px;border-radius:16px;
    box-shadow:0 24px 60px -12px rgba(0,0,0,.45);padding:32px;animation:rise .35s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .brand .dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2))}
  h1{font-size:20px;margin:0}
  .sub{color:var(--muted);font-size:13px;margin:4px 0 22px}
  .tabs{display:flex;background:#f1f5f9;border-radius:10px;padding:4px;margin-bottom:20px}
  .tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:8px;font-size:14px;
    font-weight:600;color:var(--muted);cursor:pointer;transition:.15s}
  .tabs button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
  input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px;
    outline:none;transition:.15s;background:#fff}
  input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .btn{margin-top:22px;width:100%;padding:12px;border:0;border-radius:9px;color:#fff;font-size:15px;
    font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--brand),var(--brand2))}
  .btn:hover{opacity:.94}
  .error{margin-top:14px;color:var(--err);font-size:13px;background:#fef2f2;border:1px solid #fecaca;
    padding:9px 12px;border-radius:8px}
  .hint{margin-top:18px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
  .hidden{display:none}
  .who{font-size:13px;color:var(--muted)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#eef2ff;color:#4338ca}
  a.link{color:var(--brand);text-decoration:none;font-size:14px}
  a.link:hover{text-decoration:underline}
  .panel{margin-top:18px;border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="dot"></span><h1>{% block heading %}计算机系统II{% endblock %}</h1></div>
  <div class="sub">{% block sub %}用户系统{% endblock %}</div>
  {% block content %}{% endblock %}
</div>
{% block script %}{% endblock %}
</body>
</html>
